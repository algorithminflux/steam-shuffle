name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore SteamShuffle.sln
      - name: Test
        run: dotnet test SteamShuffle.sln --configuration Release

  # Cross-publishes the Avalonia app for all three platforms from one Linux
  # runner. dotnet publish -r <rid> --self-contained fetches whatever runtime
  # pack it needs from NuGet regardless of the host OS, so there's no need
  # for windows-latest/macos-latest runners here -- we're never *running*
  # the app on the runner, only producing a binary for each target.
  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rid: win-x64
            label: win-x64
          - rid: linux-x64
            label: linux-x64
          - rid: osx-arm64
            label: osx-arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Publish (${{ matrix.rid }})
        run: >
          dotnet publish SteamShuffle/SteamShuffle.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -o publish/${{ matrix.rid }}

      # zip preserves the Unix executable bit, which matters for the
      # linux-x64/osx-arm64 binaries -- without it, users have to manually
      # chmod +x the extracted file before they can run it.
      - name: Zip
        run: |
          cd publish/${{ matrix.rid }}
          zip -r ../../SteamShuffle-${{ github.ref_name }}-${{ matrix.label }}.zip .

      - uses: actions/upload-artifact@v6
        with:
          name: build-${{ matrix.rid }}
          path: SteamShuffle-${{ github.ref_name }}-${{ matrix.label }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*.zip
          generate_release_notes: true
